
  <!DOCTYPE html>
  <html lang="es">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <meta name="theme-color" content="#2d1f14" />
      <title>Sistema UNAVET</title>
      <meta name="description" content="Sistema de gestión veterinaria UNAVET para pacientes, citas, grooming, inventario y reportes." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        (() => {
          const now = Date.now();
          const hour = new Date(now).getHours();
          let theme = hour >= 6 && hour < 18 ? 'light' : 'dark';

          try {
            const storedOverride = JSON.parse(
              localStorage.getItem('unavet_theme_manual_override') || 'null'
            );

            if (
              storedOverride &&
              (storedOverride.theme === 'light' || storedOverride.theme === 'dark') &&
              storedOverride.expiresAt > now
            ) {
              theme = storedOverride.theme;
            } else {
              localStorage.removeItem('unavet_theme_manual_override');
            }
          } catch {
            localStorage.removeItem('unavet_theme_manual_override');
          }

          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
          localStorage.setItem('unavet_theme', theme);
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
